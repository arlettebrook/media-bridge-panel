<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>首页示例 · 设置</title>
<style>
  :root {
    --bg: #0e1210; --bg-2: #151a17; --bg-3: #1c2320;
    --line: #263029; --line-2: #33403a;
    --fg: #e3e8e2; --fg-dim: #9aa79e; --fg-dim-2: #6f7d74;
    --accent: #8cda60; --accent-2: #5fae3a; --accent-dim: #2b4a1e;
    --warn: #ffb84d; --err: #ff7a6b; --blue: #6fb6ff;
    --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: radial-gradient(1200px 600px at 80% -10%, #1b2a1c 0%, var(--bg) 55%);
    color: var(--fg);
    font: 14px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .muted { color: var(--fg-dim); }
  .mono { font-family: var(--mono); }
  .hidden { display: none !important; }
  .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--fg-dim); font-weight: 600; letter-spacing: .3px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .spacer { flex: 1; }
  .btn { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--fg); cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent-2); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-color: transparent; color: #0f1a09; font-weight: 600; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12px; color: var(--fg-dim); }
  .badge.ok { color: var(--accent); border-color: var(--accent-dim); }
  .badge.err { color: var(--err); border-color: #4a2320; }
  input, select { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--fg); font-size: 13px; width: 100%; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 12px; color: var(--fg-dim); }
  .hint { font-size: 12px; color: var(--fg-dim-2); margin-top: 8px; }
  .hint.warn { color: var(--warn); }
  .err { color: var(--err); font-size: 12px; }
  .kv { display: flex; gap: 8px; font-size: 13px; padding: 3px 0; }
  .kv .k { color: var(--fg-dim); min-width: 96px; }
  code { font-family: var(--mono); font-size: 12px; background: var(--bg-3); padding: 1px 5px; border-radius: 5px; }
  .shot { height: 100px; border-radius: 8px; border: 1px solid var(--line); }
  #msg { min-height: 20px; font-size: 12px; color: var(--accent); }
  .rowblock { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; background: var(--bg-3); }
  .rowblock .head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .rowblock .head .name { font-weight: 600; }
  .rowblock .params { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 720px) {
    body { padding: 10px; }
    .form-grid, .rowblock .params { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="row between">
      <h3 style="margin:0">首页示例 · TMDB 连接</h3>
      <div class="row">
        <span id="msg"></span>
        <span class="badge" id="tokenState"></span>
      </div>
    </div>
    <div class="form-grid">
      <label class="field">
        <span>Token（v4 API Read Access Token）</span>
        <input id="token" type="password" placeholder="留空 = 不改动已保存的那个" />
      </label>
      <label class="field">
        <span>语言</span>
        <input id="language" type="text" placeholder="zh-CN" />
      </label>
      <label class="field">
        <span>API 基地址</span>
        <input id="apiBase" type="text" placeholder="留空 = https://api.themoviedb.org/3" />
      </label>
      <label class="field">
        <span>图片基地址</span>
        <input id="imageBase" type="text" placeholder="留空 = https://image.tmdb.org/t/p" />
      </label>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="save">保存</button>
      <button class="btn" id="test">测试连接</button>
      <button class="btn danger" id="clearToken">清除 Token</button>
      <span class="spacer"></span>
      <span class="muted" id="savedAt"></span>
    </div>
    <div class="hint">
      这份 Token 是**首页插件自己的**（元数据插件那份是另一个，各存各的）。测试用的是输入框里当前的值，不必先保存。Token 只存在插件自己的数据目录里，这个页面不回显它。
    </div>
    <div id="testOut" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="row between">
      <h3 style="margin:0">行参数</h3>
      <div class="row">
        <button class="btn primary" id="saveRows">保存行参数</button>
      </div>
    </div>
    <div id="rowsOut"></div>
    <div class="hint">
      每一行 = 客户端里的一个媒体库。库的「类型」（电影 / 剧集 / 混合）跟着这里的参数走：
      把「类型」切成剧集，那个库就变成剧库。
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
