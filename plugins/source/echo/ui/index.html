<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>自检 · 回声</title>
    <style>
      body {
        font: 14px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif;
        margin: 0;
        padding: 16px;
        color: #222;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      p {
        color: #666;
        margin: 0 0 12px;
      }
      button {
        padding: 6px 12px;
        margin-right: 8px;
      }
      pre {
        background: #f6f6f6;
        padding: 10px;
        border-radius: 6px;
        overflow: auto;
        max-height: 40vh;
      }
    </style>
  </head>
  <body>
    <h1>自检 · 回声</h1>
    <p>
      这个页面是<strong>插件自己的</strong> webui（静态文件放在插件包里，由面板托管）。下面这个按钮会打到
      <code>/api/plugins/source/echo/api/ping</code> —— 面板把这次请求<strong>原样转给插件</strong>，再把插件的回答原样回给浏览器。
    </p>
    <p>
      <button id="ping">打一发 /api/ping</button>
      <button id="post">发一条带内容的 POST</button>
    </p>
    <pre id="out">（点上面的按钮看结果）</pre>
    <script>
      /* 转发的绝对前缀：这一页自己就在 /api/plugins/<类型>/<id>/ui/ 下，前缀从地址里推出来 */
      const P = location.pathname.replace(/\/ui\/.*$/, '') + '/api';
      const out = document.getElementById('out');
      const show = (label, v) => {
        out.textContent = label + '\n' + JSON.stringify(v, null, 2);
      };
      document.getElementById('ping').addEventListener('click', async () => {
        try {
          show('GET …/api/ping', await (await fetch(P + '/ping')).json());
        } catch (e) {
          show('失败', String(e));
        }
      });
      document.getElementById('post').addEventListener('click', async () => {
        try {
          const r = await fetch(P + '/save', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hello: '这是插件页面发来的一段内容', at: Date.now() }),
          });
          show('POST …/api/save', await r.json());
        } catch (e) {
          show('失败', String(e));
        }
      });
    </script>
  </body>
</html>
