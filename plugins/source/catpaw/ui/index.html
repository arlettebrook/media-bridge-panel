<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>猫爪源 · 设置</title>
<style>
  :root {
    --bg: #0e1210; --bg-2: #151a17; --bg-3: #1c2320;
    --line: #263029; --line-2: #33403a;
    --fg: #e3e8e2; --fg-dim: #9aa79e; --fg-dim-2: #6f7d74;
    --accent: #8cda60; --accent-2: #5fae3a; --accent-dim: #2b4a1e;
    --warn: #ffb84d; --err: #ff7a6b; --blue: #6fb6ff;
    --radius: 12px; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    background: radial-gradient(1200px 600px at 80% -10%, #1b2a1c 0%, var(--bg) 55%);
    color: var(--fg);
    font: 14px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .muted { color: var(--fg-dim); }
  .mono { font-family: var(--mono); }
  .hidden { display: none !important; }
  .card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 14px; }
  .card h3 { margin: 0 0 10px; font-size: 13px; color: var(--fg-dim); font-weight: 600; letter-spacing: .3px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  .spacer { flex: 1; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--fg-dim); font-weight: 600; font-size: 12px; }
  td.ops { white-space: nowrap; text-align: right; }
  .btn { height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--fg); cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent-2); color: #fff; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.primary { background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-color: transparent; color: #0f1a09; font-weight: 600; }
  .btn.mini { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 7px; }
  .btn.danger:hover { border-color: var(--err); color: var(--err); }
  .badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12px; color: var(--fg-dim); }
  .badge.ok { color: var(--accent); border-color: var(--accent-dim); }
  .badge.err { color: var(--err); border-color: #4a2320; }
  .badge.warn { color: var(--warn); border-color: #4a3a1c; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--fg-dim-2); }
  .dot.running { background: var(--accent); box-shadow: 0 0 8px var(--accent-2); }
  .dot.error { background: var(--err); }
  .dot.starting { background: var(--warn); }
  input, select { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--bg-3); color: var(--fg); font-size: 13px; }
  input[type=checkbox] { height: auto; }
  label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-dim); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field > span { font-size: 12px; color: var(--fg-dim); }
  .hint { font-size: 12px; color: var(--fg-dim-2); margin-top: 8px; }
  .hint.warn { color: var(--warn); }
  .err { color: var(--err); font-size: 12px; }
  a { color: var(--blue); }
  code { font-family: var(--mono); font-size: 12px; background: var(--bg-3); padding: 1px 5px; border-radius: 5px; }
  #msg { min-height: 20px; font-size: 12px; color: var(--accent); }
  @media (max-width: 720px) {
    body { padding: 10px; }
    .form-grid { grid-template-columns: 1fr; }
    /* 窄屏把表格**摊成卡片**：列一多，一行横着放不下（按钮那一列会把整个表撑得比屏幕还宽，
     * 结果右边被裁掉、左边每个字挤成一列）。摊开之后每行自己要说明白是哪个实例。 */
    table, thead, tbody, tr, td { display: block; }
    thead { display: none; }
    tbody tr { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
    td { border: none; padding: 4px 0; }
    td.ops { text-align: left; white-space: normal; display: flex; flex-wrap: wrap; gap: 6px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="row between">
      <h3 style="margin:0">猫爪源 · 实例</h3>
      <div class="row">
        <span id="msg"></span>
        <button class="btn mini" id="reload">刷新</button>
      </div>
    </div>
    <div id="instHost"></div>
  </div>

  <div class="card">
    <h3>加一个实例</h3>
    <div class="form-grid">
      <label class="field"><span>方式</span>
        <select id="mode">
          <option value="local">本地部署（下载源包，由插件起进程）</option>
          <option value="remote">外部地址（那台机器上已经在跑的源）</option>
        </select>
      </label>
      <label class="field"><span>名字（可留空）</span>
        <input id="name" type="text" placeholder="例如：主源" />
      </label>
      <label class="field"><span id="urlLabel">源包地址（例如 https://example.com/dist/）</span>
        <input id="url" type="text" placeholder="http://…" />
      </label>
      <label class="field"><span>端口（本地部署用；0 = 自动挑一个）</span>
        <input id="port" type="number" min="0" max="65535" value="0" />
      </label>
    </div>
    <div class="row" style="margin-top:10px">
      <label class="chk"><input type="checkbox" id="autostart" /> 开机自动启动</label>
      <label class="chk"><input type="checkbox" id="enabled" checked /> 参与聚合</label>
      <label class="chk"><input type="checkbox" id="startNow" checked /> 加完就启动</label>
      <span class="spacer"></span>
      <button class="btn primary" id="add">添加</button>
    </div>
    <div class="hint" id="addHint"></div>
  </div>

  <div class="card">
    <h3>自动更新</h3>
    <div class="row">
      <label class="chk"><input type="checkbox" id="auEnabled" /> 开启</label>
      <label class="chk">每 <input id="auHours" type="number" min="1" max="168" style="width:76px" /> 小时检查一次</label>
      <button class="btn" id="auSave">保存</button>
      <button class="btn" id="auRun">立即检查</button>
      <span class="spacer"></span>
      <span class="muted" id="auState"></span>
    </div>
    <div class="hint">检查的是"远端源码包的 md5 有没有变"，变了才下载；正在运行的实例会重启一下（那会打断正在看的播放，所以默认关）。</div>
    <div id="auResults"></div>
  </div>

  <div class="card">
    <h3>缓存</h3>
    <div class="row">
      <label class="chk">有效期 <input id="cacheTtl" type="number" min="0" style="width:76px" /> 分钟（0 = 不缓存）</label>
      <label class="chk">上限 <input id="cacheMax" type="number" min="0" style="width:86px" /> MB（0 = 不限）</label>
      <button class="btn" id="cacheSave">保存</button>
    </div>
    <div class="row" style="margin-top:8px">
      <span class="muted" id="cacheState"></span>
      <span class="spacer"></span>
      <button class="btn mini" id="cacheReload">刷新</button>
      <button class="btn mini danger" id="cacheClear">清空</button>
    </div>
    <div class="hint">
      这里存的是从源站取回来的原始响应（搜索与详情），命中就不打上游、秒回。
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
